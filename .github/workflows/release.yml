name: Release with provenance
run-name: Release ${{ inputs.version }} with provenance
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version in manifest.json (no v prefix)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: bucket-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'BADtoBad/obsidian-bucket-sidebar' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: pnpm check:legacy && pnpm check:ui && pnpm check:release
      - name: Require an unchanged source tree after the build
        run: git diff --exit-code
      - name: Refuse to replace any existing release or tag
        run: node scripts/release.mjs preflight
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Attest the exact release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in main.js manifest.json styles.css; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
      - name: Upload a draft without overwriting old assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_VERSION" main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Bucket Sidebar $RELEASE_VERSION" --notes-file RELEASE-NOTES.md
      - name: Verify uploaded bytes before publication
        run: node scripts/release.mjs verify-draft
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
